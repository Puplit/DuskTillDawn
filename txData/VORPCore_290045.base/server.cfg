# Dusk Till Dawn - server.cfg

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
# license key, Steam Web API key, database login (fill these in; keep them out of anything you publish)
sv_licenseKey "changeme"   # your Cfx.re license key: https://portal.cfx.re
set steam_webApiKey "changeme"   # your Steam Web API key (vorp_core needs it set): https://steamcommunity.com/dev/apikey
set mysql_connection_string "mysql://root@localhost/VORPCore_290045?charset=utf8mb4"
sv_maxclients 32   # player slots
sv_enforceGameBuild 1491
set gamename rdr3
set sv_enforceSteamAuth true
set mysql_slow_query_warning 200

sv_hostname "Dusk Till Dawn"
sets sv_projectName "Dusk Till Dawn 18+"
sets sv_projectDesc "The West Lives After Dark"
sets locale "en-US"
sets tags "roleplay, western, serious rp, turf war, housing, supernatural"

sets "1." "🎭 18+ Serious Story Driven RP"
sets "2." "⚖️ Law & Outlaw Factions"
sets "3." "🏪 Player Owned Shops, Camps & Housing"
sets "4." "🌟 Deep Perk System, Earn Every Upgrade"
sets "5." "⛏️ Mining, Lumber, Farming & Moonshine"
sets "6." "🔪 Risk/Reward Criminal Systems"
sets "7." "🌙 Curses, Lore & Live DM Events"
sets "8." "🩸 Gangs, Territory, Dens & Fort Raids"
# sets Discord "your Discord invite link"   # shown in the server browser; uncomment and fill in
load_server_icon myLogo.png

sets sv_pureLevel 1
set sv_experimentalNetGameEventHandler false
set txAdmin-menuPtfxDisable true
set chat_showJoins false
set chat_showQuits false

setr voice_useSendingRangeOnly true
setr voice_use3dAudio true
setr voice_enableUi 0
setr voice_enableRadios 0

# onesync is set in txAdmin, not here

increase_pool_size "AttachmentExtension" 430
increase_pool_size "CDoorExtension " 160
increase_pool_size "CLightEntity " 2000
increase_pool_size "CMoveObject" 100
increase_pool_size "CPropSetObjectExtension" 450
increase_pool_size "FragmentStore" 4000
increase_pool_size "InteriorProxy" 450
increase_pool_size "netGameEvent" 400
increase_pool_size "OcclusionInteriorInfo" 10
increase_pool_size "OcclusionPathNode" 1500
increase_pool_size "OcclusionPortalEntity" 140
increase_pool_size "OcclusionPortalInfo" 140
increase_pool_size "PortalInst" 150
increase_pool_size "ScaleformStore" 200
increase_pool_size "StaticBounds" 6500
increase_pool_size "TxdStore" 26000

