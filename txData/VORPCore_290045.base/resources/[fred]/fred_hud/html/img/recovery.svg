<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- pup: post-revive recovery icon for fred_hud. Solid white line art to match
       the hunger/thirst/thermometer icons - the old stress2.png was a red blob
       that read as a wound and clashed with every other circle on the HUD.
       A pulse line says "recovering" without competing with the heart. -->
