# pup: these aces now gate BOTH the command AND the matching net event, so a
# player who cannot run /weather also cannot fire weathersync:setWeather by hand
# (see the EVENT_ACE table in server.lua). Mapping:
#   command.weather   -> setWeather / resetWeather / setWeatherPattern / resetWeatherPattern
#   command.time      -> setTime / resetTime
#   command.timescale -> setTimescale / resetTimescale
#   command.wind      -> setWind / resetWind
#   command.syncdelay -> setSyncDelay / resetSyncDelay
#   command.weatherui -> opening the panel and its live 1s feed
#
# The lines below stay commented because server.cfg already grants admins
# everything with `add_ace group.admin command allow`. Uncomment only if you
# ever narrow that blanket grant, or admins will lose the weather panel.
#add_ace group.admin command.syncdelay allow
#add_ace group.admin command.time allow
#add_ace group.admin command.timescale allow
#add_ace group.admin command.weather allow
#add_ace group.admin command.weatherui allow
#add_ace group.admin command.wind allow

add_ace builtin.everyone command.forecast allow
add_ace builtin.everyone command.mytime allow
add_ace builtin.everyone command.myweather allow
add_ace builtin.everyone command.weathersync allow
