<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Identity Paper</title>
    <link rel="stylesheet" href="paper.css">
</head>
<body>
    <div id="paper" class="paper" aria-hidden="true">
        <svg class="guilloche" viewBox="-380 -250 760 500" aria-hidden="true"><g id="rosette"></g></svg>
        <img class="watermark" src="img/logo.png" alt="">

        <svg class="frame" viewBox="0 0 760 500" aria-hidden="true">
            <defs>
                <g id="flourish" fill="none" stroke="currentColor" stroke-width="0.9">
                    <path d="M4 34 C4 16 16 4 34 4"/>
                    <path d="M11 22 A7 7 0 1 1 22 11 M11 22 A4 4 0 1 0 16 16"/>
                    <circle cx="40" cy="4" r="1.3" fill="currentColor" stroke="none"/>
                    <circle cx="4" cy="40" r="1.3" fill="currentColor" stroke="none"/>
                </g>
            </defs>
            <rect x="13" y="13" width="734" height="474" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <rect x="19" y="19" width="722" height="462" fill="none" stroke="currentColor" stroke-width="0.6"/>
            <use href="#flourish" transform="translate(19 19)"/>
            <use href="#flourish" transform="translate(741 19) scale(-1 1)"/>
            <use href="#flourish" transform="translate(19 481) scale(1 -1)"/>
            <use href="#flourish" transform="translate(741 481) scale(-1 -1)"/>
        </svg>

        <div class="sheet">
            <header class="top">
                <div class="stamp">
                    <div class="stamp-label" data-word="issued"></div>
                    <div class="stamp-value fit" id="f-issued"></div>
                </div>
                <div class="nation" data-word="nation"></div>
                <div class="stamp">
                    <div class="stamp-label" data-word="charId"></div>
                    <div class="stamp-value fit" id="f-serial"><span data-word="serial"></span> <span id="f-number"></span></div>
                </div>
            </header>

            <h1 class="title" data-word="title"></h1>
            <svg class="rule" viewBox="0 0 320 12" aria-hidden="true">
                <path d="M0 4 H148 M172 4 H320 M14 8 H148 M172 8 H306" stroke="currentColor" stroke-width="0.8" fill="none"/>
                <path d="M160 0.5 L166 6 L160 11.5 L154 6 Z" fill="currentColor"/>
            </svg>

            <section class="body">
                <div class="left">
                    <div class="thumb-box"><svg id="thumb" viewBox="-40 -50 80 100" aria-hidden="true"></svg></div>
                    <div class="thumb-cap" data-word="thumb"></div>
                    <div class="no-transfer" data-word="notTransferable"></div>
                </div>
                <div class="right">
                    <p class="preamble" data-word="preamble"></p>
                    <div class="row">
                        <span class="label" data-word="labelName"></span>
                        <span class="value fit" id="f-name"></span>
                    </div>
                    <div class="row">
                        <span class="label" data-word="labelOccupation"></span>
                        <span class="value fit" id="f-occupation"></span>
                    </div>
                    <div class="sign">
                        <div class="signature fit" id="f-signature"></div>
                        <div class="sign-line"></div>
                        <div class="sign-label" data-word="signLabel"></div>
                    </div>
                </div>
            </section>
        </div>

        <svg class="seal" viewBox="-60 -60 120 120" aria-hidden="true">
            <defs>
                <radialGradient id="wax" cx="38%" cy="34%" r="70%">
                    <stop offset="0" stop-color="#b8372a"/>
                    <stop offset="0.55" stop-color="#8c1d13"/>
                    <stop offset="1" stop-color="#5a0e08"/>
                </radialGradient>
                <radialGradient id="wax-press" cx="60%" cy="62%" r="65%">
                    <stop offset="0" stop-color="#9a2518"/>
                    <stop offset="1" stop-color="#6d140c"/>
                </radialGradient>
                <path id="star" d="M0 -22 L5.2 -7.1 L20.9 -6.8 L8.4 2.7 L12.9 17.8 L0 8.8 L-12.9 17.8 L-8.4 2.7 L-20.9 -6.8 L-5.2 -7.1 Z"/>
            </defs>
            <path id="seal-blob" fill="url(#wax)"/>
            <circle r="37" fill="url(#wax-press)"/>
            <circle r="37" fill="none" stroke="#4a0a05" stroke-width="1.6" opacity="0.7"/>
            <circle r="38.6" fill="none" stroke="#d8695a" stroke-width="0.8" opacity="0.45"/>
            <circle r="31" fill="none" stroke="#4a0a05" stroke-width="0.7" stroke-dasharray="1.2 2.4" opacity="0.7"/>
            <use href="#star" transform="translate(1.2 1.4)" fill="#3e0804" opacity="0.75"/>
            <use href="#star" transform="translate(-0.9 -1)" fill="#e27a6a" opacity="0.5"/>
            <use href="#star" fill="#8a1c12"/>
            <ellipse cx="-16" cy="-30" rx="11" ry="4" transform="rotate(-28 -16 -30)" fill="#ffffff" opacity="0.14"/>
        </svg>
    </div>
    <script src="paper.js"></script>
</body>
</html>
