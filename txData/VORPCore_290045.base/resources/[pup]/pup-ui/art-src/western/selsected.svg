<svg xmlns="http://www.w3.org/2000/svg" width="432" height="52" viewBox="0 0 432 52">
  <!-- pup-ui focus frame: a hand-inked crimson outline.
       Drawn for pup-ui (GPL-3.0). Rendered to selsected.png at 432x52
       (the file name keeps its old spelling so no stylesheet has to change). -->
  <defs>
    <filter id="ink" x="-2%" y="-10%" width="104%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.2" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#ink)" fill="none">
    <rect x="3" y="3" width="426" height="46" stroke="#B80D12" stroke-width="3"/>
    <rect x="5.5" y="5.5" width="421" height="41" stroke="#7A0A0D" stroke-width="1" opacity="0.55"/>
  </g>
</svg>
